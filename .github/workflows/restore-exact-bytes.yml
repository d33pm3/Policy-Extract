name: Restore exact bytes

on:
  push:
    branches: [main]
    paths:
      - ".exact-src/**"
      - "scripts/_restore_exact_bytes.py"
      - ".github/workflows/restore-exact-bytes.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble and verify
        run: python3 scripts/_restore_exact_bytes.py
      - name: Commit restored originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts references schemas
          if git diff --cached --quiet; then
            echo "No byte changes to commit"
            exit 0
          fi
          git commit -m "Restore exact local bytes from .exact-src (SHA-256 verified)"
          git push
