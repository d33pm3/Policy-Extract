name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Compile
        run: python3 -m py_compile scripts/*.py
      - name: Live version pin
        run: python3 scripts/assert_live_version.py
      - name: Regression
        run: python3 scripts/run_regression_tests.py
      - name: Smoke
        run: python3 scripts/smoke_live_skill.py
